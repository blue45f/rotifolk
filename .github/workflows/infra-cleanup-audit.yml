name: Temporary infrastructure cleanup audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EC2_SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authorize runner SSH ingress
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsSL https://api.ipify.org)"
          RUNNER_SSH_CIDR="${RUNNER_IP}/32"
          echo "RUNNER_SSH_CIDR=$RUNNER_SSH_CIDR" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_SSH_CIDR},Description=infra-audit-${GITHUB_RUN_ID}}]" \
            || true

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/infra_cleanup.pem
          chmod 600 ~/.ssh/infra_cleanup.pem
          ssh-keyscan -T 20 -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Audit AWS and remote resources
        run: |
          set -euo pipefail
          echo '=== AWS instance ==='
          aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=ip-address,Values=$EC2_HOST" \
            --query 'Reservations[].Instances[].{InstanceId:InstanceId,State:State.Name,PublicIp:PublicIpAddress,Name:Tags[?Key==`Name`]|[0].Value,Volumes:BlockDeviceMappings[].Ebs.VolumeId,SecurityGroups:SecurityGroups[].GroupId}' \
            --output json
          SSH=(ssh -i ~/.ssh/infra_cleanup.pem -o BatchMode=yes -o ConnectTimeout=20 "${EC2_USER}@${EC2_HOST}")
          "${SSH[@]}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== host ==='
          printf 'user=%s host=%s\n' "$(id -un)" "$(hostname)"
          echo '=== containers ==='
          sudo docker ps -a --format 'CONTAINER\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Networks}}\t{{.Mounts}}\t{{.Ports}}' | sort
          echo '=== mounts ==='
          ids="$(sudo docker ps -aq)"
          if [ -n "$ids" ]; then
            sudo docker inspect $ids --format 'INSPECT\t{{.Name}}\t{{range .Mounts}}{{.Type}}:{{.Name}}:{{.Source}}:{{.Destination}};{{end}}' | sort
          fi
          echo '=== volumes ==='
          sudo docker volume ls --format 'VOLUME\t{{.Name}}' | sort
          echo '=== target paths ==='
          sudo find /opt -maxdepth 3 -mindepth 1 \
            \( -iname '*rotifolk*' -o -iname '*promptmarket*' -o -iname '*protolive*' -o -iname '*proto-live*' -o -iname '*offhours*' -o -iname '*familycare*' -o -iname '*family-care*' \) \
            -printf '%y\t%p\n' 2>/dev/null | sort || true
          echo '=== target images ==='
          sudo docker images --format 'IMAGE\t{{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.Size}}' \
            | grep -Ei 'rotifolk|promptmarket|protolive|proto-live|offhours|familycare|family-care' | sort || true
          echo '=== proxy references ==='
          sudo grep -RHEi 'rotifolk|promptmarket|protolive|proto-live|offhours|familycare|family-care' /opt /etc/caddy \
            --include='Caddyfile' --include='*.caddy' --include='compose*.yml' --include='compose*.yaml' --include='docker-compose*.yml' --include='docker-compose*.yaml' \
            2>/dev/null | head -n 250 || true
          REMOTE

      - name: Revoke runner SSH ingress
        if: always() && env.RUNNER_SSH_CIDR != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_SSH_CIDR" || true
